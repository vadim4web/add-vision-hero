<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="inverted-mask">
      <rect fill="white" width="100%" height="100%" />
      <g id="movingGroup" fill="none" stroke="black" stroke-width="28">
        <line x1="200" y1="386" x2="200" y2="14" />
        <line x1="200" y1="14" x2="14" y2="200" />
        <line x1="14" y1="200" x2="200" y2="200" />
        <path d="M 200,14 A 93, 93 0 1 1 200,200" />
        <circle cx="200" cy="200" r="200" />
      </g>

      <text id="visionText" x="0" y="0" fill="black" text-anchor="middle">VISION</text>
      <text id="addText" x="0" y="0" fill="black" text-anchor="middle">ADD</text>
    </mask>
  </defs>

  <rect fill="black" mask="url(#inverted-mask)" width="100%" height="100%" />
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>

<script>
  gsap.registerPlugin(MotionPathPlugin);

  const group = document.querySelector("#movingGroup");
  let groupOffset = { x: 0, y: 0 };

  function getGroupCenter() {
    const bbox = group.getBBox();
    return {
      x: bbox.x + bbox.width / 2,
      y: bbox.y + bbox.height / 2
    };
  }

  function centerGroup() {
    const { x: groupCenterX, y: groupCenterY } = getGroupCenter();
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;

    const offsetX = viewportWidth / 2 - groupCenterX;
    const offsetY = viewportHeight / 2 - groupCenterY;

    groupOffset = { x: offsetX, y: offsetY };

    gsap.set(group, {
      x: offsetX,
      y: offsetY,
      transformOrigin: `${groupCenterX}px ${groupCenterY}px`
    });
  }

  function animateGroup() {
    gsap.killTweensOf([group]);

    gsap.to(group, {
      duration: 10,
      repeat: -1,
      yoyo: true,
      ease: "power1.inOut",
      rotation: 720
    });
  }

  function generateSpiralPath(centerX, centerY, startRadius, endRadius, turns, endX, endY) {
    const points = [];
    const steps = 100;

    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const angle = t * turns * 2 * Math.PI;
      const radius = startRadius * (1 - t) + endRadius * t;
      const x = centerX + Math.cos(angle) * radius;
      const y = centerY + Math.sin(angle) * radius;
      points.push({ x, y });
    }

    points.push({ x: endX, y: endY });
    return points;
  }

  function animateTextSpiral() {
    const vision = document.querySelector("#visionText");
    const add = document.querySelector("#addText");

    gsap.killTweensOf([vision, add]);

    const rawCenter = getGroupCenter();
    const centerX = rawCenter.x + groupOffset.x;
    const centerY = rawCenter.y + groupOffset.y;

    const visionBox = vision.getBBox();
    const addBox = add.getBBox();
    const logoBox = group.getBBox();

    const spacing = -40;


    // Враховуємо offset (тобто переміщення групи логотипа)
    const logoLeft = logoBox.x + groupOffset.x;
    const logoRight = logoBox.x + logoBox.width + groupOffset.x;
    const logoTop = logoBox.y + groupOffset.y;
    const logoBottom = logoBox.y + logoBox.height + groupOffset.y;

    const visionTarget = {
      x: logoRight + visionBox.width / 2 + spacing * 1.66,
      y: logoTop + visionBox.height * 0.5
    };

    const addTarget = {
      x: logoLeft - addBox.width / 2 - spacing,
      y: logoBottom + addBox.height * 0
    };

    const duration= 10;
    const turns = Math.PI * 2;
    const startRadius = 1000;
    const endRadius = -logoBox.height * 0.5;

    gsap.set(vision, { x: 2000, y: 2000 });
    gsap.set(add, { x: -1000, y: -1000 });

    gsap.to(vision, {
      duration,
      ease: "power2.inOut",
      yoyo: true,
      repeat: -1,
      motionPath: {
        path: generateSpiralPath(centerX, centerY, startRadius, endRadius, turns, visionTarget.x, visionTarget.y),
        autoRotate: false
      }
    });

    gsap.to(add, {
      duration,
      ease: "power2.inOut",
      yoyo: true,
      repeat: -1,
      motionPath: {
        path: generateSpiralPath(centerX, centerY, startRadius, endRadius, turns, addTarget.x, addTarget.y),
        autoRotate: false
      }
    });
  }

  window.addEventListener("load", () => {
    centerGroup();
    animateGroup();
    animateTextSpiral();
  });

  window.addEventListener("resize", () => {
    centerGroup();
    animateGroup();
    animateTextSpiral();
  });
</script>
