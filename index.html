<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <title>AddVision.dev</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      transition: background 1s ease;
    }

    body.light {
      background: white;
      color: black;
      transition: background 1s ease;
    }

    body.light rect[mask] {
      fill: white;
    }

    .theme-toggle {
      position: absolute;
      top: 25px;
      right: 25px;
      width: 0;
      height: 0;
      padding: 0;
      border-radius: 50%;
      border: 3.5vmin solid;
      border-color: white white black black;
      outline: 2px solid #ffffff80;
      cursor: pointer;
      z-index: 10;
      transition: outline-color 0.5s ease, border-color 0.5s ease;
    }

    body.light .theme-toggle {
      border-color: black black white white;
      outline-color: #00000080;
    }

    .bg-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      transition: opacity 1.5s ease-in-out;
      z-index: -1;
    }

    #bg1 { opacity: 1; }
    #bg2 { opacity: 0; }

    svg {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #movingGroup {
      transform-box: fill-box;
      transform-origin: center;
    }

    text {
      font-family: "Outfit", sans-serif;
      font-optical-sizing: auto;
      font-weight: 900;
      font-style: normal;
    }

    #visionText {
      font-size: 9vmin;
    }

    #addText {
      font-size: 11vmin;
    }

    #clockText {
      font-size: 5vmin;
      font-weight: 600;
    }

    #copyrightText {
      font-size: 3.5vmin;
      color: currentColor;
      width: 100%;
      text-align: center;
      padding-bottom: 25px;
      font-weight: 100;
    }
  </style>
</head>
<body>

<button class="theme-toggle" id="themeToggle"></button>

<div id="bg1" class="bg-layer"></div>
<div id="bg2" class="bg-layer"></div>

<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="inverted-mask">
      <rect fill="white" width="100%" height="100%" />
      <g id="movingGroup" fill="none" stroke="black" stroke-width="28">
        <line x1="200" y1="386" x2="200" y2="14" />
        <line x1="200" y1="14" x2="14" y2="200" />
        <line x1="14" y1="200" x2="200" y2="200" />
        <path d="M 200,14 A 93, 93 0 1 1 200,200" />
        <circle cx="200" cy="200" r="200" />
      </g>

      <text id="visionText" x="0" y="0" fill="black" text-anchor="middle">VISION</text>
      <text id="addText" x="0" y="0" fill="black" text-anchor="middle">ADD</text>

      <text id="clockText" x="25" y="65" fill="black">0000-00-00 00:00:00</text>
    </mask>
  </defs>

  <rect fill="black" mask="url(#inverted-mask)" width="100%" height="100%" />
</svg>

<text
id="copyrightText"
fill="black"
text-anchor="middle"
style="position: absolute; bottom: 0; left: 0%"
>© 2013–2025 AddVision.dev</text>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>

<script>
  gsap.registerPlugin(MotionPathPlugin);

  const group = document.querySelector("#movingGroup");
  let groupOffset = { x: 0, y: 0 };

  function getGroupCenter() {
    const bbox = group.getBBox();
    return {
      x: bbox.x + bbox.width / 2,
      y: bbox.y + bbox.height / 2
    };
  }

  function centerGroup() {
    const { x: groupCenterX, y: groupCenterY } = getGroupCenter();
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;

    const offsetX = viewportWidth / 2 - groupCenterX;
    const offsetY = viewportHeight / 2 - groupCenterY;

    groupOffset = { x: offsetX, y: offsetY };

    gsap.set(group, {
      x: offsetX,
      y: offsetY,
      transformOrigin: `${groupCenterX}px ${groupCenterY}px`
    });
  }

  function animateGroup(onRepeatCallback) {
    gsap.killTweensOf(group);

    gsap.to(group, {
      duration: 10,
      repeat: -1,
      yoyo: true,
      ease: "power1.inOut",
      rotation: 720,
      onRepeat: onRepeatCallback
    });
  }

  function generateSpiralPath(centerX, centerY, startRadius, endRadius, turns, endX, endY) {
    const points = [];
    const steps = 100;

    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const angle = t * turns * 2 * Math.PI;
      const radius = startRadius * (1 - t) + endRadius * t;
      const x = centerX + Math.cos(angle) * radius;
      const y = centerY + Math.sin(angle) * radius;
      points.push({ x, y });
    }

    points.push({ x: endX, y: endY });
    return points;
  }

  function animateTextSpiral() {
    const vision = document.querySelector("#visionText");
    const add = document.querySelector("#addText");

    gsap.killTweensOf([vision, add]);

    const rawCenter = getGroupCenter();
    const centerX = rawCenter.x + groupOffset.x;
    const centerY = rawCenter.y + groupOffset.y;

    const visionBox = vision.getBBox();
    const addBox = add.getBBox();
    const logoBox = group.getBBox();

    const spacing = -40;

    const logoLeft = logoBox.x + groupOffset.x;
    const logoRight = logoBox.x + logoBox.width + groupOffset.x;
    const logoTop = logoBox.y + groupOffset.y;
    const logoBottom = logoBox.y + logoBox.height + groupOffset.y;

    const visionTarget = {
      x: logoRight + visionBox.width / 2 + spacing * 1.66,
      y: logoTop + visionBox.height * 0.5
    };

    const addTarget = {
      x: logoLeft - addBox.width / 2 - spacing * 1.1,
      y: logoBottom + addBox.height * 0
    };

    const duration = 10;
    const turns = Math.PI * 2;
    const startRadius = 1000;
    const endRadius = -logoBox.height * 0.5;

    gsap.set(vision, { x: 2000, y: 2000 });
    gsap.set(add, { x: -1000, y: -1000 });

    gsap.to(vision, {
      duration,
      ease: "power2.inOut",
      yoyo: true,
      repeat: -1,
      motionPath: {
        path: generateSpiralPath(centerX, centerY, startRadius, endRadius, turns, visionTarget.x, visionTarget.y),
        autoRotate: false
      }
    });

    gsap.to(add, {
      duration,
      ease: "power2.inOut",
      yoyo: true,
      repeat: -1,
      motionPath: {
        path: generateSpiralPath(centerX, centerY, startRadius, endRadius, turns, addTarget.x, addTarget.y),
        autoRotate: false
      }
    });
  }

  function updateClock() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const clockStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById("clockText").textContent = clockStr;
  }

  setInterval(updateClock, 1000);
  updateClock();

  function updateCopyright() {
    const year = new Date().getFullYear();
    document.getElementById("copyrightText").textContent = `© 2013-${year} AddVision.dev`;
  }

const backgrounds = [
  'https://picsum.photos/id/1015/1200/800',
  'https://picsum.photos/seed/apr/800',
  'https://picsum.photos/seed/may/800',
  'https://picsum.photos/seed/jun/800',
  'https://picsum.photos/seed/jul/800',
  'https://picsum.photos/seed/aug/800',
  'https://picsum.photos/seed/sep/800',
  'https://picsum.photos/seed/oct/800',
  'https://picsum.photos/seed/nov/800',
  'https://picsum.photos/seed/dec/800',
  'https://picsum.photos/seed/jan/800',
  'https://picsum.photos/seed/feb/800',
  'https://picsum.photos/seed/mar/800',
];
let bgIndex = 0;
let currentLayer = 1;

const bg1 = document.getElementById("bg1");
const bg2 = document.getElementById("bg2");

bg1.style.backgroundImage = `url(${backgrounds[bgIndex]})`;

function nextBackground() {
  const nextIndex = (bgIndex + 1) % backgrounds.length;
  const nextUrl = `url(${backgrounds[nextIndex]})`;

  const topLayer = currentLayer === 1 ? bg2 : bg1;
  const bottomLayer = currentLayer === 1 ? bg1 : bg2;

  topLayer.style.backgroundImage = nextUrl;
  topLayer.style.opacity = 1;
  bottomLayer.style.opacity = 0;

  currentLayer = currentLayer === 1 ? 2 : 1;
  bgIndex = nextIndex;
}


  window.addEventListener("load", () => {
    centerGroup();
    animateGroup(nextBackground);
    animateTextSpiral();
    updateCopyright();
  });

  window.addEventListener("resize", () => {
    centerGroup();
    animateTextSpiral();
  });

  function applyTheme(theme) {
  document.body.classList.toggle('light', theme === 'light');
  localStorage.setItem('theme', theme);
}

document.getElementById("themeToggle").addEventListener("click", () => {
  const current = document.body.classList.contains('light') ? 'light' : 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  applyTheme(next);
});

window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem('theme');
  if (saved === 'light') {
    applyTheme('light');
  }
});

</script>

</body>
</html>
